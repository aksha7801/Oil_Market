# NOTE: key names follow CHECKER_CONTRACT.md. Diff against starter/ manifest and
# schemas/dashboard.schema.json before grading (starter files were not available when written).
schema_version: 2
subject: oil_market
title: "Do the world's oil forecasters still agree? IEA vs OPEC vs EIA, 2026"
dashboard:
  entrypoint: app.py
  pages: [app.py]
  pipeline: src/data.py
  views_module: src/views.py
acquisition:
  method: script
  path: src/data.py
  description: >
    Monthly forecast vintages transcribed from the IEA Oil Market Report, OPEC Monthly Oil Market
    Report and EIA Short-Term Energy Outlook as compiled in the IEF comparative analysis. New
    vintages are added to data/raw/new_vintages.csv and merged by `python src/data.py --mode live`.
  retrieved: "2026-10-26"
sources:
  - id: ief_comparative
    title: Comparative Analysis of Monthly Reports on the Oil Market
    publisher: International Energy Forum (IEF)
    url: https://www.ief.org/data/comparative-analysis
  - id: iea_omr
    title: Oil Market Report
    publisher: International Energy Agency (IEA)
    url: https://www.iea.org/reports/oil-market-report-october-2026
  - id: opec_momr
    title: Monthly Oil Market Report
    publisher: Organization of the Petroleum Exporting Countries (OPEC)
    url: https://momr.opec.org
  - id: eia_steo
    title: Short-Term Energy Outlook
    publisher: U.S. Energy Information Administration (EIA)
    url: https://www.eia.gov/outlooks/steo/
datasets:
  - id: agency_forecasts
    sources: [ief_comparative, iea_omr, opec_momr, eia_steo]
    sample: data/sample/agency_forecasts.csv
    processed_output: data/processed/agency_forecasts.csv
    primary_key: [record_id]
    date_column: report_month
    latest_observation: "2026-10-01"
    date_minimum: "2026-01-01"
    date_maximum: "2026-10-01"
    columns:
      - {name: record_id, type: string, nullable: false, description: "report month | agency | target year"}
      - {name: agency, type: string, nullable: false, allowed: [IEA, OPEC, EIA]}
      - {name: report_month, type: date, nullable: false, description: "Month of the report (vintage), first day"}
      - {name: target_year, type: integer, nullable: false, minimum: 2025, maximum: 2030}
      - {name: demand_growth_mbd, type: number, nullable: false, unit: mb/d, minimum: -10, maximum: 10}
      - {name: demand_level_mbd, type: number, nullable: true, unit: mb/d, minimum: 90, maximum: 115}
      - {name: value_basis, type: string, nullable: false, allowed: [reported, derived]}
views:
  - id: forecast_evolution
    dataset_id: agency_forecasts
    page: app.py
    source_ids: [ief_comparative, iea_omr, opec_momr, eia_steo]
    outputs: [chart, metric, table, download]
    download_label: Download filtered forecasts (CSV)
    controls:
      - {key: fe_agencies, type: multiselect, label: Agencies, default_value: [IEA, OPEC, EIA],
         test_value: [IEA, OPEC], empty_test_value: [], empty_expected_text: "No forecasts match the current selection",
         filter: {column: agency, operator: isin}}
      - {key: fe_year, type: selectbox, label: Forecast year, default_value: 2026, test_value: 2027,
         filter: {column: target_year, operator: equals}}
      - {key: fe_period, type: slider, label: Report months, default_value: ["2026-01-01", "2026-10-01"],
         test_value: ["2026-03-01", "2026-09-01"], filter: {column: report_month, operator: range}}
  - id: agency_gap
    dataset_id: agency_forecasts
    page: app.py
    source_ids: [ief_comparative, iea_omr, opec_momr, eia_steo]
    outputs: [chart, metric, table, download]
    download_label: Download filtered forecasts (CSV)
    controls:
      - {key: gap_agencies, type: multiselect, label: Agencies, default_value: [IEA, OPEC, EIA],
         test_value: [IEA, EIA], empty_test_value: [], empty_expected_text: "No forecasts match the current selection",
         filter: {column: agency, operator: isin}}
      - {key: gap_year, type: selectbox, label: Forecast year, default_value: 2026, test_value: 2027,
         filter: {column: target_year, operator: equals}}
      - {key: gap_measure, type: radio, label: Measure, default_value: "Growth (mb/d y/y)", test_value: "Level (mb/d)"}
  - id: revision_tracker
    dataset_id: agency_forecasts
    page: app.py
    source_ids: [ief_comparative, iea_omr, opec_momr, eia_steo]
    outputs: [chart, metric, table, download]
    download_label: Download filtered forecasts (CSV)
    controls:
      - {key: rev_agencies, type: multiselect, label: Agencies, default_value: [IEA, OPEC, EIA],
         test_value: [IEA, OPEC], empty_test_value: [], empty_expected_text: "No forecasts match the current selection",
         filter: {column: agency, operator: isin}}
      - {key: rev_period, type: slider, label: Report months, default_value: ["2026-01-01", "2026-10-01"],
         test_value: ["2026-03-01", "2026-09-01"], filter: {column: report_month, operator: range}}
      - {key: rev_baseline, type: selectbox, label: Baseline vintage, default_value: "2026-01-01", test_value: "2026-04-01"}
# Replace with the oil_market `required_fields` from config/topic_profiles.yml.
topic_integrity:
  vintage_preserved: "Every row is one agency's forecast as published in one monthly report; later revisions are separate rows, never overwritten."
  definitions_differ: "IEA, OPEC and EIA define and baseline oil demand differently; growth (y/y change) is compared more than levels."
  derived_values: "Two rows (IEA and EIA, Aug 2026) are derived from the following month's reported revision and are flagged value_basis=derived."
  known_gaps: "EIA October 2026 vintage not collected; levels missing where the compilation did not report them."
