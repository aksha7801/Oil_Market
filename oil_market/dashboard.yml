# Shaped to schemas/dashboard.schema.json per grader findings. topic_integrity fields still need checking against config/topic_profiles.yml.
schema_version: 2
dashboard:
  title: Do the world's oil forecasters still agree? IEA vs OPEC vs EIA, 2026
  subject: oil_market
  question: How well do the IEA, OPEC and EIA estimates of 2026 world oil demand growth agree, and when and by how
    much did they diverge as the 2026 supply shock unfolded?
  audience: Energy analysts and policy staff who must judge which agency forecast to rely on and how wide the uncertainty
    is.
  entrypoint: app.py
  pages:
  - app.py
pipeline:
  acquisition_method: script
  acquisition_path: src/data.py
  transform_command:
  - python
  - -m
  - src.data
  download_declared: true
  download_label: Download filtered forecasts (CSV)
  date_label: Latest observation
sources:
- id: ief_comparative
  title: Comparative Analysis of Monthly Reports on the Oil Market
  publisher: International Energy Forum (IEF)
  url: https://www.ief.org/data/comparative-analysis
  licence: Copyright IEF; figures cited with attribution for non-commercial analysis
  retrieved: '2026-10-26'
  cadence: monthly
  status: snapshot
- id: iea_omr
  title: Oil Market Report
  publisher: International Energy Agency (IEA)
  url: https://www.iea.org/reports/oil-market-report-october-2026
  licence: Copyright IEA; summary figures cited with attribution
  retrieved: '2026-10-26'
  cadence: monthly
  status: snapshot
- id: opec_momr
  title: Monthly Oil Market Report
  publisher: Organization of the Petroleum Exporting Countries (OPEC)
  url: https://momr.opec.org
  licence: Copyright OPEC; summary figures cited with attribution
  retrieved: '2026-10-26'
  cadence: monthly
  status: snapshot
- id: eia_steo
  title: Short-Term Energy Outlook
  publisher: U.S. Energy Information Administration (EIA)
  url: https://www.eia.gov/outlooks/steo/
  licence: U.S. government work, public domain
  retrieved: '2026-10-26'
  cadence: monthly
  status: snapshot
datasets:
- id: agency_forecasts
  sample: data/sample/agency_forecasts.csv
  processed_output: data/processed/agency_forecasts.csv
  primary_key:
  - record_id
  date_column: report_month
  latest_observation: '2026-10-01'
  columns:
    record_id:
      type: string
      nullable: false
      role: identifier
    agency:
      type: string
      nullable: false
      role: dimension
      allowed_values:
      - IEA
      - OPEC
      - EIA
    report_month:
      type: date
      nullable: false
      role: time
      date_minimum: '2026-01-01'
      date_maximum: '2026-10-01'
    target_year:
      type: integer
      nullable: false
      minimum: 2025
      maximum: 2030
      role: dimension
    demand_growth_mbd:
      type: number
      nullable: false
      unit: mb/d
      minimum: -10
      maximum: 10
      role: measure
    demand_level_mbd:
      type: number
      nullable: true
      unit: mb/d
      minimum: 90
      maximum: 115
      role: measure
    value_basis:
      type: string
      nullable: false
      role: dimension
      allowed_values:
      - reported
      - derived
  source_ids:
  - ief_comparative
  - iea_omr
  - opec_momr
  - eia_steo
views:
- id: forecast_evolution
  dataset_id: agency_forecasts
  page: app.py
  source_ids:
  - ief_comparative
  - iea_omr
  - opec_momr
  - eia_steo
  outputs:
  - chart
  - metric
  - table
  - download
  controls:
  - key: fe_agencies
    type: multiselect
    label: Agencies
    default_value:
    - IEA
    - OPEC
    - EIA
    test_value:
    - IEA
    - OPEC
    empty_test_value: []
    empty_expected_text: No forecasts match the current selection
    filter:
      column: agency
      operator: isin
  - key: fe_year
    type: selectbox
    label: Forecast year
    default_value: 2026
    test_value: 2027
    filter:
      column: target_year
      operator: equals
  - key: fe_period
    type: slider
    label: Report months
    default_value:
    - '2026-01-01'
    - '2026-10-01'
    test_value:
    - '2026-03-01'
    - '2026-09-01'
    filter:
      column: report_month
      operator: range
  title: How each agency's demand-growth forecast evolved
  unit: mb/d
- id: agency_gap
  dataset_id: agency_forecasts
  page: app.py
  source_ids:
  - ief_comparative
  - iea_omr
  - opec_momr
  - eia_steo
  outputs:
  - chart
  - metric
  - table
  - download
  controls:
  - key: gap_agencies
    type: multiselect
    label: Agencies
    default_value:
    - IEA
    - OPEC
    - EIA
    test_value:
    - IEA
    - EIA
    empty_test_value: []
    empty_expected_text: No forecasts match the current selection
    filter:
      column: agency
      operator: isin
  - key: gap_year
    type: selectbox
    label: Forecast year
    default_value: 2026
    test_value: 2027
    filter:
      column: target_year
      operator: equals
  - key: gap_measure
    type: radio
    label: Measure
    default_value: Growth (mb/d y/y)
    test_value: Level (mb/d)
  title: Gap between the highest and lowest agency forecast
  unit: mb/d
- id: revision_tracker
  dataset_id: agency_forecasts
  page: app.py
  source_ids:
  - ief_comparative
  - iea_omr
  - opec_momr
  - eia_steo
  outputs:
  - chart
  - metric
  - table
  - download
  controls:
  - key: rev_agencies
    type: multiselect
    label: Agencies
    default_value:
    - IEA
    - OPEC
    - EIA
    test_value:
    - IEA
    - OPEC
    empty_test_value: []
    empty_expected_text: No forecasts match the current selection
    filter:
      column: agency
      operator: isin
  - key: rev_period
    type: slider
    label: Report months
    default_value:
    - '2026-01-01'
    - '2026-10-01'
    test_value:
    - '2026-03-01'
    - '2026-09-01'
    filter:
      column: report_month
      operator: range
  - key: rev_baseline
    type: selectbox
    label: Baseline vintage
    default_value: '2026-01-01'
    test_value: '2026-04-01'
  title: How far each agency has revised its 2026 forecast
  unit: mb/d
topic_integrity:
  physical_units: million barrels per day (mb/d)
  frequency: monthly
  observation_status: Monthly agency forecast vintages for world oil demand; rows marked derived are estimated from the next published revision and not direct agency observations.
  publication_vintage: January to October 2026 monthly report vintages, with September and October 2026 values for the 2027 forecast horizon.
  vintage_preserved: Every row is one agency's forecast as published in one monthly report; later revisions are
    separate rows, never overwritten.
  definitions_differ: IEA, OPEC and EIA define and baseline oil demand differently; growth (y/y change) is compared
    more than levels.
  derived_values: Two rows (IEA and EIA, Aug 2026) are derived from the following month's reported revision and
    are flagged value_basis=derived.
  known_gaps: EIA October 2026 vintage not collected; levels missing where the compilation did not report them.
